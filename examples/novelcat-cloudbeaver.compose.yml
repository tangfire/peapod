services:
  prod-mysql-tunnel:
    image: alpine:3.20
    container_name: novelcat-prod-mysql-tunnel
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        set -eu
        if ! command -v ssh >/dev/null 2>&1; then
          apk add --no-cache openssh-client >/dev/null
        fi
        while true; do
          ssh -i /ssh/prod_db_tunnel_ed25519 \
            -p 22 \
            -o BatchMode=yes \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/tmp/known_hosts \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -N -L 0.0.0.0:13306:172.22.0.8:3306 \
            codex@124.222.163.79
          echo "prod mysql tunnel exited, reconnecting in 5s"
          sleep 5
        done
    volumes:
      - ./ssh:/ssh:ro
    expose:
      - "13306"
    networks:
      - db-console

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: novelcat-prod-cloudbeaver
    restart: unless-stopped
    depends_on:
      - prod-mysql-tunnel
    ports:
      - "127.0.0.1:${CLOUDBEAVER_PORT:-18978}:8978"
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace
    networks:
      - db-console

networks:
  db-console:
    name: novelcat-prod-db-console

volumes:
  cloudbeaver_workspace:
